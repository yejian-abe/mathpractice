name: Build Android APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake \
            libtool libtool-bin pkg-config cmake build-essential ccache \
            libssl-dev libffi-dev libltdl-dev
          # libltdl-dev 提供 LT_SYS_SYMBOL_USCORE 宏：p4a libffi recipe 在
          # autoreconf 阶段必需，缺失则报 "possibly undefined macro" 而失败

      - name: Install Buildozer
        run: |
          pip install --upgrade pip wheel
          pip install cython==0.29.36 buildozer virtualenv

      - name: Add swap
        run: |
          # clang 编译 p4a android 模块的巨型生成 C 文件（_android.c）内存占用极高，
          # runner 默认 7GB 内存不足时 clang 会被系统 OOM 杀掉，python -m build 以
          # exit 1 静默收场（日志戛然而止无报错文本）。加 swap 缓解。
          sudo swapoff -a || true
          sudo fallocate -l 7G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build APK
        run: |
          # 0) 许可指纹最优先写入（buildozer 初始化前就生效，任何后续 sdkmanager
          #    调用均视为已接受；连 runner 预装 SDK 一起写，双保险）
          SDK=$HOME/.buildozer/android/platform/android-sdk
          FP="24333f8a63b6825ea9c5514f83c2829b004d1fee"
          FPP="84831b9409646a918e30573bab4c9c9136d15d73"
          for d in "$SDK" /usr/local/lib/android/sdk; do
            mkdir -p "$d/licenses"
            echo "$FP" > "$d/licenses/android-sdk-license"
            echo "$FPP" > "$d/licenses/android-sdk-preview-license"
          done
          # 1) 初始化 buildozer 的 SDK/NDK（首次 aidl 检查可能失败，允许继续）
          buildozer android update || true
          # 2) 定位 sdkmanager：优先 buildozer SDK，找不到则用 runner 预装 SDK 的
          #    （run #7 曾出现 cmdline-tools 未就位导致 find 落空，build-tools 没装上）
          SDKM=$(find $SDK -name sdkmanager -type f 2>/dev/null | head -n1)
          if [ -z "$SDKM" ]; then
            SDKM=$(find /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | head -n1)
          fi
          echo "sdkmanager: $SDKM"
          # 3) 用 --sdk_root 强制把 build-tools 装进 buildozer 的 SDK（许可已写，无提示）
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --sdk_root=$SDK "build-tools;37.0.0" >/dev/null || true
            yes | "$SDKM" --sdk_root=$SDK "platforms;android-31" >/dev/null || true
          fi
          ls $SDK/build-tools || echo "WARNING: build-tools missing, buildozer will retry"
          # 4) 正式构建。完整日志写入文件，无论成败都输出最后 200 行：
          #    buildozer -v 日志量极大，GitHub 网页端会截断超长日志，
          #    导致真正的报错（在末尾）永远看不到
          buildozer -v android debug > build_full.log 2>&1
          CODE=$?
          echo "=== buildozer exit code: $CODE ==="
          echo "=== log tail (last 200 lines) ==="
          tail -n 200 build_full.log
          exit $CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build_full.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mathpractice-apk
          path: bin/*.apk
