name: Build Android APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake \
            libtool pkg-config cmake build-essential ccache libssl-dev libffi-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip wheel
          pip install cython==0.29.36 buildozer virtualenv

      - name: Build APK
        run: |
          # 1) 初始化 buildozer 的 SDK/NDK（首次 aidl 检查可能失败，允许继续）
          buildozer android update || true
          # 2) 直接写入许可指纹文件（sdkmanager 检测到即视为已接受，彻底免交互；
          #    hash 为 Google 官方 android-sdk-license 2019-01-16 版指纹）
          SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c9136d15d73" > $SDK/licenses/android-sdk-preview-license
          # 3) 显式补装 build-tools 与 platform（许可已写入，不会再弹确认）
          SDKM=$(find $SDK -name sdkmanager -path '*cmdline-tools*' | head -n1)
          echo "sdkmanager: $SDKM"
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" "build-tools;37.0.0" >/dev/null || true
            yes | "$SDKM" "platforms;android-31" >/dev/null || true
          else
            echo "WARNING: sdkmanager not found, buildozer will download on next step"
          fi
          # 4) 正式构建
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathpractice-apk
          path: bin/*.apk
