name: Build Android APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake \
            libtool pkg-config cmake build-essential ccache libssl-dev libffi-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip wheel
          pip install cython==0.29.36 buildozer virtualenv

      - name: Build APK
        run: |
          # 1) 初始化 buildozer 的 SDK/NDK（accept_license 自动接受；首次 aidl 检查可能失败，允许继续）
          buildozer android update || true
          # 2) 显式接受全部 SDK 许可并补装 build-tools（无交互终端时更新通道会静默跳过）
          SDKM=$(find $HOME/.buildozer/android/platform/android-sdk -name sdkmanager 2>/dev/null | head -n1)
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            yes | "$SDKM" "build-tools;37.0.0" >/dev/null 2>&1 || true
            yes | "$SDKM" "platforms;android-31" >/dev/null 2>&1 || true
          fi
          # 3) 正式构建
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathpractice-apk
          path: bin/*.apk
