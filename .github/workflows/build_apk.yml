name: Build Android APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake \
            libtool libtool-bin pkg-config cmake build-essential ccache \
            libssl-dev libffi-dev libltdl-dev
          # libltdl-dev 提供 LT_SYS_SYMBOL_USCORE 宏：p4a libffi recipe 在
          # autoreconf 阶段必需，缺失则报 "possibly undefined macro" 而失败

      - name: Install Buildozer
        run: |
          pip install --upgrade pip wheel
          pip install cython==0.29.36 buildozer virtualenv

      - name: Add swap
        run: |
          # clang 编译 p4a android 模块的巨型生成 C 文件（_android.c）内存占用极高，
          # runner 默认 7GB 内存不足时 clang 会被系统 OOM 杀掉，python -m build 以
          # exit 1 静默收场（日志戛然而止无报错文本）。加 swap 缓解。
          sudo swapoff -a || true
          sudo fallocate -l 7G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build APK
        run: |
          # 0) 许可指纹最优先写入（buildozer 初始化前就生效，任何后续 sdkmanager
          #    调用均视为已接受；连 runner 预装 SDK 一起写，双保险）
          SDK=$HOME/.buildozer/android/platform/android-sdk
          FP="24333f8a63b6825ea9c5514f83c2829b004d1fee"
          FPP="84831b9409646a918e30573bab4c9c9136d15d73"
          for d in "$SDK" /usr/local/lib/android/sdk; do
            mkdir -p "$d/licenses"
            echo "$FP" > "$d/licenses/android-sdk-license"
            echo "$FPP" > "$d/licenses/android-sdk-preview-license"
          done
          # 1) 关键修复：buildozer 1.6 只认老版布局 $SDK/tools/bin/sdkmanager
          #    （源码 sdkmanager_path 硬编码，不认 cmdline-tools，缺失即抛
          #    BuildozerException 秒挂——run #8/#9 根因）；p4a 的 get_targets
          #    还要找 avdmanager（cmdline-tools/latest/bin 或 tools/bin，
          #    报错文案误写为 "android or sdkmanager"——run #10 根因）。
          #    把 runner 预装 cmdline-tools 的整个 bin 目录软链到两个位置
          #    （fdroid CI 同款方案）。buildozer.spec 的
          #    android.accept_sdk_license（正确键名）已修，其后 buildozer
          #    自己会装 platform-tools/build-tools/platforms
          SDKM=$(find /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | head -n1)
          echo "sdkmanager: $SDKM"
          if [ -z "$SDKM" ]; then
            echo "ERROR: runner 上未找到 sdkmanager"; exit 1
          fi
          SDKBIN=$(dirname "$SDKM")
          SDKLATEST=$(dirname "$SDKBIN")   # .../cmdline-tools/latest（含 bin+lib）
          # 注意一：不能只软链二进制——p4a 调 avdmanager 不传 --sdk_root，
          #   会从工具自身物理位置推断 SDK 根目录，软链会解析回预装 SDK
          #   （只见 API 34/35/36，报 "Requested API target 31 is not
          #   available"——run #11 根因）
          # 注意二：不能只拷 bin——sdkmanager/avdmanager 启动时按
          #   APP_HOME=bin 上级找 lib/（CLASSPATH），缺 lib 起不来。
          #   必须拷贝整个 latest 目录，让推断根目录落到 $SDK
          mkdir -p $SDK/cmdline-tools $SDK/tools/bin
          rm -rf $SDK/cmdline-tools/latest
          cp -a "$SDKLATEST" $SDK/cmdline-tools/latest
          ln -sf $SDK/cmdline-tools/latest/bin/sdkmanager $SDK/tools/bin/sdkmanager
          ln -sf $SDK/cmdline-tools/latest/bin/avdmanager $SDK/tools/bin/avdmanager
          # 显式保险：确保 android-31 与 build-tools 落在 $SDK（许可已写，无提示）
          "$SDKM" --sdk_root=$SDK "platforms;android-31" >/dev/null || true
          "$SDKM" --sdk_root=$SDK "build-tools;37.0.0" >/dev/null || true
          ls $SDK/platforms $SDK/build-tools || echo "WARNING: buildozer update 会自行补装"
          # 2) 初始化 buildozer 的 SDK/NDK（许可指纹已写 + 软链就位，应无提示）
          buildozer android update || true
          # 2.5) 关键修复（run #13/#14 根因）：p4a 用 hostpython3（CPython
          #    3.14.2）建 venv，其 ensurepip 种出的 pip 自身 import 链断裂
          #    （build_env/installer.py 引 capture_logging，utils/logging.py
          #    没有该符号）→ pip 一启动就 ImportError 报废，连
          #    `venv/bin/pip install Cython` 也全挂。宿主 python 的 pip 正常，
          #    故为 ensurepip 捆绑轮子缺陷。修复：把 build.py 的
          #    `pip install -U pip` 替换为 get-pip.py 强制重装（绕开坏种子，
          #    装完 PyPI 最新完整 pip，后续全部 venv/bin/pip 调用恢复正常）
          #    补丁必须 git commit 固化：debug 阶段 buildozer 会重查 p4a
          #    仓库（clean/pull），未提交的 sed 修改会被回滚（run #14 教训）
          P4A_DIR=$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android
          P4A_BUILD=$P4A_DIR/pythonforandroid/build.py
          if [ ! -f "$P4A_BUILD" ]; then
            echo "ERROR: p4a build.py 不存在，buildozer update 可能未克隆 p4a"; exit 1
          fi
          sed -i 's|pip install -U pip|curl -sSL https://bootstrap.pypa.io/get-pip.py -o get-pip.py \&\& python get-pip.py --force-reinstall|' "$P4A_BUILD"
          grep -c "get-pip.py" "$P4A_BUILD" >/dev/null \
            || { echo "ERROR: sed 未生效，p4a 源码结构可能已变化"; exit 1; }
          git -C "$P4A_DIR" add pythonforandroid/build.py
          git -C "$P4A_DIR" -c user.email=ci@local -c user.name=ci \
            commit -q -m "ci: repair broken ensurepip-seeded venv pip via get-pip.py" \
            || echo "WARNING: 补丁 commit 失败（将依赖 sed 直接生效）"
          # 3) 正式构建。完整日志写入文件，无论成败都输出最后 200 行：
          #    buildozer -v 日志量极大，GitHub 网页端会截断超长日志，
          #    导致真正的报错（在末尾）永远看不到。
          #    注意：本步骤以 bash -e 运行，必须用 || CODE=$? 兜住退出码，
          #    否则 buildozer 失败时脚本立即退出，诊断输出会被吞掉（run #8 教训）
          buildozer -v android debug > build_full.log 2>&1 || CODE=$?
          CODE=${CODE:-0}
          echo "=== buildozer exit code: $CODE ==="
          echo "=== log tail (last 200 lines) ==="
          tail -n 200 build_full.log
          exit $CODE

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-full-log
          path: build_full.log

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mathpractice-apk
          path: bin/*.apk
