name: Build Android APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip openjdk-17-jdk autoconf automake \
            libtool pkg-config cmake build-essential ccache libssl-dev libffi-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip wheel
          pip install cython==0.29.36 buildozer virtualenv

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mathpractice-apk
          path: bin/*.apk
