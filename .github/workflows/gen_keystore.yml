name: Generate Android Keystore

# 一次性工具：生成固定的 release 签名密钥库并输出 base64。
# 操作步骤：
#   1. 本页 Run workflow，在 keystore_password 中填写你自定义的密码（务必记住）
#   2. 运行完成后下载 artifact（keystore-release.zip）
#   3. 将其中的 keystore_b64.txt 全部内容复制为仓库 Secret：ANDROID_KEYSTORE_B64
#      将其中的 password.txt 内容复制为仓库 Secret：ANDROID_KEYSTORE_PASSWORD
#      alias 固定为 mathpractice（无需设置）
#   4. 触发 Build Android APK 构建，产物即为固定签名的 release APK
on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: "keystore 密码（自行设定并牢记，至少 6 位）"
        required: true
        type: string

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        env:
          KS_PASS: ${{ github.event.inputs.keystore_password }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "ERROR: 密码为空"; exit 1; fi
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias mathpractice \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=MathPractice, OU=MathPractice, O=MathPractice, C=CN"
          echo "=== 校验签名库 ==="
          keytool -list -keystore release.keystore -storepass "$KS_PASS" | grep mathpractice
          base64 -w0 release.keystore > keystore_b64.txt
          printf '%s' "$KS_PASS" > password.txt
          echo "=== keystore_b64.txt 首尾预览（确认已生成）==="
          head -c 60 keystore_b64.txt; echo " ..."; tail -c 40 keystore_b64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-release
          path: |
            keystore_b64.txt
            password.txt
          retention-days: 30
          if-no-files-found: error
